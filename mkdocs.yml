# TechDocs of the DX Delivery Operator: the docs/ folder, shown in the EUROPESIP Internal Developer
# Portal (Backstage) through the annotation backstage.io/techdocs-ref of its catalog entity. Build locally (same as
# Backstage):
#   pip install mkdocs-techdocs-core==1.7.1 && mkdocs serve
site_name: DX Delivery Operator
site_description: Kubernetes operator that delivers HCL DX applications and content from Git and keeps them in DX as declared (not an HCL product)
repo_url: https://github.com/europesip/dx-delivery-operator
edit_uri: edit/main/docs/
docs_dir: docs

plugins:
  - techdocs-core

# docs/specs/ (one spec per issue) is kept in the repository but left out of the site
exclude_docs: |
  specs/

nav:
  - Overview: index.md
  - How it works: how-it-works.md
  - 'Guide: migrate a portal, XMLAccess': migration-guide.md
  - Restrictions and limitations: limitations.md
  - Portable bundles (DXExport): portable-bundles.md
  - Attributes of the artifacts: artifact-annotations.md
  - 'Secret fields: whose credentials': secret-fields.md
  - 'WCM maintenance modules': wcm-admin-tasks.md
  - 'DX Core (traditional DX on WebSphere)': dx-core.md
  - 'Java extensions (DXJavaExtension)': java-extensions.md
  - API reference: reference.md
  - How we work: workflow.md
  - Español:
      - Introducción: index.es.md
      - Cómo funciona: how-it-works.es.md
      - 'Guía: migrar un portal, XMLAccess': migration-guide.es.md
      - Restricciones y limitaciones: limitations.es.md
      - Paquetes portables (DXExport): portable-bundles.es.md
      - Atributos de los artefactos: artifact-annotations.es.md
      - 'Campos de Secrets: de quién es cada credencial': secret-fields.es.md
      - 'Módulos de mantenimiento de WCM': wcm-admin-tasks.es.md
      - 'DX Core (DX tradicional sobre WebSphere)': dx-core.es.md
      - 'Extensiones Java (DXJavaExtension)': java-extensions.es.md
      - Cómo trabajamos: workflow.es.md

# Heading anchors as GitHub makes them (accents kept: #instalación), so the same links work on GitHub and here
markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
