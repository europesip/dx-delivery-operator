# DX Core (traditional DX 9.5 on WebSphere): connection, export of a site with its theme from one portal, and its import
# into another (DX Core or DX Compose). See docs/dx-core.md.
---
# 1. The DX Core of the HCL chart (namespace dx-core). Secrets: wpsadmin, the Config Wizard and the WebSphere
#    administrators (the three the chart takes: security.core.customWpsSecret / customConfigWizardSecret / customWasSecret).
apiVersion: dx.europesip.com/v1alpha1
kind: DXConnection
metadata: {name: dx, namespace: dx-core}
spec:
  url: https://dx-core.example.com
  internalURL: http://dx-deployment-core.dx-core.svc:10039
  runtime: core
  credentialsSecret: {name: dx-core-wps}
  dxConnect:
    credentialsSecret: {name: dx-core-configwizard}
    wasCredentialsSecret: {name: dx-core-was}
---
# 2. A traditional DX on a VM with an empty context root (read-only source)
apiVersion: dx.europesip.com/v1alpha1
kind: DXConnection
metadata: {name: dx-vm, namespace: dx-core}
spec:
  url: https://dx-vm.example.com:10042
  runtime: core
  contentHandlerPath: /mycontenthandler
  credentialsSecret: {name: dx-vm-admin}
  caSecret: {name: dx-vm-ca}
---
# 3. Export a site (page subtree) with its theme (registration + skins + WebDAV files)
apiVersion: dx.europesip.com/v1alpha1
kind: DXExport
metadata: {name: site-europesip, namespace: dx-core}
spec:
  connectionRef: {name: dx-vm}
  parts:
    themes: [custom.portal.theme.Tema-Jordi-DEMO]
    pages: [{uniqueName: EuropeSip_web}]
  destination:
    image: harbor.example.com/dx-artifacts/sites/vm-europesip-web:20261122
    pushSecrets: [{name: harbor-push}]
---
# 4. Import into another portal: the theme files first, then the theme registration and the pages
apiVersion: dx.europesip.com/v1alpha1
kind: DXTheme
metadata: {name: tema-jordi-demo, namespace: dx-core}
spec:
  connectionRef: {name: dx}
  folder: Tema-Jordi-DEMO
  uniqueName: custom.portal.theme.Tema-Jordi-DEMO
  titles: {es: "Tema Jordi DEMO"}
  registration: FilesOnly
  base: {copyFiles: false}
  source:
    image:
      ref: harbor.example.com/dx-artifacts/sites/vm-europesip-web:20261122
      pullSecrets: [{name: harbor-push}]
---
apiVersion: dx.europesip.com/v1alpha1
kind: DXXMLAccess
metadata: {name: site-europesip, namespace: dx-core}
spec:
  connectionRef: {name: dx}
  source:
    image:
      ref: harbor.example.com/dx-artifacts/sites/vm-europesip-web:20261122
      pullSecrets: [{name: harbor-push}]
  files: [themes/theme-tema-jordi-demo.xml, xmlaccess/01-pages.xml]
  objectIDs: Keep
  dependsOn: [{apiVersion: dx.europesip.com/v1alpha1, kind: DXTheme, name: tema-jordi-demo}]
---
# 5. WCM libraries of DX Core (through DXConnect), importable into DX Compose and the other way round
apiVersion: dx.europesip.com/v1alpha1
kind: DXWCMLibraryExport
metadata: {name: core-portal-site, namespace: dx-core}
spec:
  connectionRef: {name: dx}
  libraries: ["Portal Site"]
  destination:
    image: harbor.example.com/dx-artifacts/wcm/core-portal-site:20261122
    pushSecrets: [{name: harbor-push}]
