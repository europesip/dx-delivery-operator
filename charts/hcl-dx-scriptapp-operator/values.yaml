# HCL DX Script Application operator

image:
  repository: ghcr.io/europesip/hcl-dx-scriptapp-operator
  tag: ""                      # default: the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The operator image includes HCL DXClient (from HCL's public image hclcr.io/dx-public/dxclient), which is HCL
# software under its own licence. The chart refuses to install until you accept it. Read it with:
#   docker run --rm hclcr.io/dx-public/dxclient:v95_CF239_20261103-1404 /dxclient/bin/dxclient accept-license
dxclient:
  acceptLicense: false

# Namespaces whose resources the operator reconciles. Empty: all namespaces (ClusterRole). With a list, the
# operator only watches those (it still needs a ClusterRole to read the cluster-scoped CRDs).
watchNamespaces: []

dx:
  # DX with OpenID Connect (Keycloak, Entra ID...): when the REST login of DX answers without a session cookie (Liberty
  # renames it to WAS_n... with the OIDC client), sign in with the portal login form. Added in 0.1.2.
  # false = the behaviour of 0.1.1 (REST login only).
  oidcCompatibility: true

replicas: 1                    # more than 1 only for high availability: leader election keeps one active
leaderElection: true
logLevel: info                 # info or debug
# json: one JSON object per line, easy to query in Loki/Elastic. console: human-readable lines.
logFormat: json
# logEvents: also write every Kubernetes event of the operator (pushes, drift, restores, imports, failures) as a log line
# (dxopEvent=true, reason, kind, resourceNamespace, resourceName). Default false: most log stacks already collect
# Kubernetes events (e.g. Grafana Alloy loki.source.kubernetes_events), and both would store every event twice. Turn it
# on only when the cluster does not ship Kubernetes events.
logEvents: false

resources:
  # 0.6.1: unpacking a WCM export (a .tar.bz2 of hundreds of MB) is CPU work; with 50m on a busy node the health
  # probes timed out and the pod restarted in a loop
  requests: { cpu: 500m, memory: 512Mi }
  limits: { memory: 2Gi }      # DXClient (Node.js) runs inside the pod during pushes

# Working folder: cache of the sources (by revision) and working copies of the applications
workDir:
  sizeLimit: 8Gi   # 0.6.1: a WCM export archive, its unpacked tree and one chunk zip at a time (was 2Gi)

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
# 0.6.1: prefer worker nodes (the control plane has little CPU); preferred, so a one-node cluster keeps working
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }

# Health probes of the manager (0.6.1: configurable; a long unpack must not look like a hung process)
probes:
  timeoutSeconds: 5
  failureThreshold: 6
priorityClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
