apiVersion: v2
name: dx-delivery-operator
description: >-
  DX Delivery Operator (formerly HCL DX Script Application operator): delivers HCL DX applications and content
  from Git. It pushes Script Applications to WCM, creates their pages and DAM collections, prepares the database
  of their backend, moves WCM libraries, themes, pages and portal bundles between portals, and keeps everything
  as declared (drift correction). Not an HCL product.
type: application
