{{- if not .Values.dxclient.acceptLicense }}
{{- fail "The operator image includes HCL DXClient: read its licence and accept it with --set dxclient.acceptLicense=true (see the README)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dxop.fullname" . }}
  labels: {{- include "dxop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "dxop.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dxop.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dxop.serviceAccount" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElection }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --zap-log-level={{ .Values.logLevel }}
            {{- if (.Values.javaExtensions).enabled }}
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            - --webhook-port=9443
            {{- end }}
            {{- if eq .Values.logFormat "json" }}
            - --zap-devel=false
            - --zap-encoder=json
            {{- end }}
          env:
            - { name: DXCLIENT_ACCEPT_LICENSE, value: "true" }
            - { name: WORK_DIR, value: /work }
            # 0.15.0 (#63): a writable HOME for any UID (the HOME of the image is /home/dx_user, only for UID 1000)
            - { name: HOME, value: /tmp }
            - { name: OPERATOR_VERSION, value: {{ .Chart.AppVersion | quote }} }
            - { name: LOG_EVENTS, value: {{ .Values.logEvents | quote }} }
            - { name: WATCH_NAMESPACES, value: {{ join "," .Values.watchNamespaces | quote }} }
            - { name: DX_FORM_LOGIN, value: {{ ternary "false" "auto" (eq (toString (.Values.dx).oidcCompatibility) "false") | quote }} }
            - { name: ENABLE_CONTROLLERS, value: {{ join "," (.Values.enableControllers | default list) | quote }} }
            - { name: LEADER_ELECTION_ID, value: {{ .Values.leaderElectionID | default "" | quote }} }
            - { name: JAVA_EXTENSIONS_ROLLOUT_TIMEOUT, value: {{ (.Values.javaExtensions).rolloutTimeout | default "" | quote }} }
            {{- if (.Values.javaExtensions).enabled }}
            - { name: JAVA_EXTENSIONS_WEBHOOK, value: "true" }
            - { name: JAVA_EXTENSIONS_INIT_IMAGE, value: "{{ .Values.javaExtensions.initImage.repository }}:{{ .Values.javaExtensions.initImage.tag | default .Chart.AppVersion }}" }
            - { name: JAVA_EXTENSIONS_INIT_PULL_POLICY, value: {{ .Values.javaExtensions.initImage.pullPolicy | quote }} }
            - { name: JAVA_EXTENSIONS_INIT_PULL_SECRET, value: {{ .Values.javaExtensions.initImage.pullSecret | default "" | quote }} }
            {{- end }}
          ports:
            - { name: health, containerPort: 8081 }
            {{- if (.Values.javaExtensions).enabled }}
            - { name: webhook, containerPort: 9443 }
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: {{ (.Values.probes).timeoutSeconds | default 5 }}
            failureThreshold: {{ (.Values.probes).failureThreshold | default 6 }}
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: {{ (.Values.probes).timeoutSeconds | default 5 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
            # 0.15.0 (#63): DXClient writes its configuration here; an emptyDir, so it does not depend on the
            # permissions HCL gives /dxclient in its image
            - { name: dxclient-store, mountPath: /dxclient/store }
            {{- if (.Values.javaExtensions).enabled }}
            - { name: webhook-cert, mountPath: /tmp/k8s-webhook-server/serving-certs, readOnly: true }
            {{- end }}
      volumes:
        - name: work
          emptyDir: { sizeLimit: {{ .Values.workDir.sizeLimit }} }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: dxclient-store
          emptyDir: { sizeLimit: 16Mi }
        {{- if (.Values.javaExtensions).enabled }}
        - name: webhook-cert
          secret: { secretName: {{ include "dxop.fullname" . }}-webhook-cert }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
