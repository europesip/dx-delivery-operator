# DX Delivery Operator (formerly HCL DX Script Application operator)

# Resource names: by default <release>-dx-delivery-operator. An install made with 0.12.x or earlier (chart
# hcl-dx-scriptapp-operator) can keep its resource names with nameOverride: hcl-dx-scriptapp-operator.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/europesip/dx-delivery-operator
  tag: ""                      # default: the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The operator image includes HCL DXClient (from HCL's public image hclcr.io/dx-public/dxclient), which is HCL
# software under its own licence. The chart refuses to install until you accept it. Read it with:
#   docker run --rm hclcr.io/dx-public/dxclient:v95_CF239_20261103-1404 /dxclient/bin/dxclient accept-license
dxclient:
  acceptLicense: false

# Namespaces whose resources the operator reconciles. Empty: all namespaces (ClusterRole). With a list, the
# operator only watches those (it still needs a ClusterRole to read the cluster-scoped CRDs).
watchNamespaces: []

dx:
  # DX with OpenID Connect (Keycloak, Entra ID...): when the REST login of DX answers without a session cookie (Liberty
  # renames it to WAS_n... with the OIDC client), sign in with the portal login form. Added in 0.1.2.
  # false = the behaviour of 0.1.1 (REST login only).
  oidcCompatibility: true

replicas: 1                    # more than 1 only for high availability: leader election keeps one active
leaderElection: true
logLevel: info                 # info or debug
# json: one JSON object per line, easy to query in Loki/Elastic. console: human-readable lines.
logFormat: json
# logEvents: also write every Kubernetes event of the operator (pushes, drift, restores, imports, failures) as a log line
# (dxopEvent=true, reason, kind, resourceNamespace, resourceName). Default false: most log stacks already collect
# Kubernetes events (e.g. Grafana Alloy loki.source.kubernetes_events), and both would store every event twice. Turn it
# on only when the cluster does not ship Kubernetes events.
logEvents: false

resources:
  # 0.6.1: unpacking a WCM export (a .tar.bz2 of hundreds of MB) is CPU work; with 50m on a busy node the health
  # probes timed out and the pod restarted in a loop
  requests: { cpu: 500m, memory: 512Mi }
  limits: { memory: 2Gi }      # DXClient (Node.js) runs inside the pod during pushes

# Working folder: cache of the sources (by revision) and working copies of the applications
workDir:
  sizeLimit: 8Gi   # 0.6.1: a WCM export archive, its unpacked tree and one chunk zip at a time (was 2Gi)

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
# 0.6.1: prefer worker nodes (the control plane has little CPU); preferred, so a one-node cluster keeps working
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }

# Health probes of the manager (0.6.1: configurable; a long unpack must not look like a hung process)
probes:
  timeoutSeconds: 5
  failureThreshold: 6
priorityClassName: ""

# Security context of the operator pod (0.15.0, issue #63). Only settings that every platform accepts: no UID, GID or
# fsGroup, so the same values work on any Kubernetes and on OpenShift (restricted-v2 SCC) without a flag. On k3s and
# other Kubernetes the process runs as the UID of the image (1000); on OpenShift the SCC gives the UID of the
# namespace range. The writable paths (/work, /tmp, /dxclient/store, HOME=/tmp) are emptyDir volumes, so any UID works.
# Before 0.15.0 the chart fixed runAsUser/runAsGroup/fsGroup 1000; set them here to keep that.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Only these controllers run (empty: all), for example a second instance of the operator that only handles
# dxjavaextension in a test namespace. Names: dxconnection, dxscriptapplication, dxpage, dxxmlaccess, dxtheme,
# dxdamcollection, dxwcmlibraryimport, dxexport, dxwcmlibraryexport, dxwcmadmintask, dxdatabase, dxjavaextension.
enableControllers: []
# The leader-election lease (empty: the lease of every release so far). Give a second instance its own.
leaderElectionID: ""

# DXJavaExtension (0.14.0, issue #54): Java extensions (portlet WARs, shared-library JARs) loaded from a registry
# onto the official DX Compose Web Engine image. Off by default. When on, the chart registers a mutating admission
# webhook (served by the operator pod) that adds an init container to the Web Engine pods of the namespaces with
# the label below. The webhook certificate comes from cert-manager or, on OpenShift, from the service CA (see
# javaExtensions.certificate).
javaExtensions:
  enabled: false
  # How long a rollout may take before the operator rolls back to the previous version (Go duration; empty = 30m).
  # spec.rolloutTimeout of a DXJavaExtension overrides it.
  rolloutTimeout: ""
  initImage:
    repository: ghcr.io/europesip/dx-delivery-operator/dx-extensions-init
    tag: ""                    # default: the chart appVersion
    pullPolicy: IfNotPresent
    # A Secret (dockerconfigjson) in every portal namespace to pull the init image from a private registry; the
    # webhook adds it to the Web Engine pod. Empty: the image is public (ghcr.io).
    pullSecret: ""
  webhook:
    # Fail (default): a Web Engine pod is not created while the webhook does not answer (it is retried), so the
    # Web Engine never starts without its extensions. Ignore: the pod starts without them.
    failurePolicy: Fail
    timeoutSeconds: 10
    # The namespaces where the webhook acts (the DXJavaExtension controller also checks this label).
    namespaceSelector:
      matchLabels: { dx.europesip.com/java-extensions: enabled }
    # The Web Engine pods (label app of the HCL chart: <release>-web-engine).
    objectSelector:
      matchExpressions:
        - { key: app, operator: In, values: [dx-deployment-web-engine] }
  # Who issues the certificate of the webhook (0.15.0, issue #63):
  #   auto (default): on OpenShift without cert-manager, the service CA of OpenShift (annotations on the Service and
  #     the webhook); everywhere else cert-manager (the behaviour before 0.15.0).
  #   cert-manager / openshift-service-ca: force one. With `helm template` or Argo CD Helm cannot see the APIs of the
  #     cluster and auto means cert-manager: set openshift-service-ca there (or pass --api-versions route.openshift.io/v1).
  certificate:
    provider: auto
  certManager:
    # An Issuer of this release (self-signed) or an existing issuer.
    createSelfSignedIssuer: true
    issuerName: ""             # with createSelfSignedIssuer false: an existing Issuer (or ClusterIssuer) name
    issuerKind: Issuer
